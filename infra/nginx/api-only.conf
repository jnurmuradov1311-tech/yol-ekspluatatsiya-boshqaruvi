server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 15m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;

    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        # Do not preserve a client-supplied X-Forwarded-For chain. PHP trusts
        # this internal gateway, so it must originate the forwarding value.
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param REQUEST_ID $request_id;
        fastcgi_read_timeout 125s;
        fastcgi_buffering off;
    }

    location = /up {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param REQUEST_ID $request_id;
    }

    location / {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"Endpoint topilmadi."}}';
    }
}
