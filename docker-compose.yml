name: roadops

x-api-environment: &api-environment
  APP_NAME: "Yo'l ekspluatatsiyasini boshqarish"
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_KEY: ${APP_KEY:?APP_KEY must be set in .env}
  APP_URL: ${APP_URL:-http://localhost:8080}
  WEB_URL: ${WEB_URL:-http://localhost:8080}
  PRIMARY_ROAD_CODE: ${PRIMARY_ROAD_CODE:-D001}
  PRIMARY_ROAD_LENGTH_M: ${PRIMARY_ROAD_LENGTH_M:-67000}
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${POSTGRES_DB:-roadops}
  DB_USERNAME: ${DB_USERNAME:-roadops_php}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
  DB_SYNC_USERNAME: ${DB_SYNC_USERNAME:-roadops_sync_login}
  DB_SYNC_PASSWORD: ${DB_SYNC_PASSWORD:?DB_SYNC_PASSWORD must be set in .env}
  DB_SSLMODE: disable
  REDIS_URL: redis://redis:6379/0
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  SESSION_COOKIE: ${SESSION_COOKIE:-roadops_session}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
  SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-480}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
  YTP_SYNC_ENABLED: ${YTP_SYNC_ENABLED:-false}
  YTP_BASE_URL: ${YTP_BASE_URL:-}
  YTP_CLIENT_ID: ${YTP_CLIENT_ID:-}
  YTP_CLIENT_SECRET: ${YTP_CLIENT_SECRET:-}
  YTP_WEBHOOK_SECRET: ${YTP_WEBHOOK_SECRET:-}
  ROADVISION_MODE: ${ROADVISION_MODE:-s3_manifest}
  ROADVISION_SYNC_ENABLED: ${ROADVISION_SYNC_ENABLED:-false}
  ROADVISION_API_URL: ${ROADVISION_API_URL:-}
  ROADVISION_CLIENT_ID: ${ROADVISION_CLIENT_ID:-}
  ROADVISION_CLIENT_SECRET: ${ROADVISION_CLIENT_SECRET:-}
  ROADVISION_WEBHOOK_SECRET: ${ROADVISION_WEBHOOK_SECRET:-}
  ROADVISION_S3_BUCKET: ${ROADVISION_S3_BUCKET:-}
  ROADVISION_S3_REGION: ${ROADVISION_S3_REGION:-}
  ROADVISION_S3_PREFIX: ${ROADVISION_S3_PREFIX:-results/}
  ROADVISION_MANIFEST_CANONICALIZATION: ${ROADVISION_MANIFEST_CANONICALIZATION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roadops}
      POSTGRES_USER: ${POSTGRES_USER:-roadops_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [backend]
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    environment:
      DB_OWNER_HOST: postgres
      DB_OWNER_PORT: 5432
      DB_OWNER_DATABASE: ${POSTGRES_DB:-roadops}
      DB_OWNER_USERNAME: ${POSTGRES_USER:-roadops_owner}
      DB_OWNER_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DB_OWNER_SSLMODE: disable
      DB_APP_USERNAME: ${DB_USERNAME:-roadops_php}
      DB_APP_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      DB_SYNC_USERNAME: ${DB_SYNC_USERNAME:-roadops_sync_login}
      DB_SYNC_PASSWORD: ${DB_SYNC_PASSWORD:?DB_SYNC_PASSWORD must be set in .env}
      DB_REPORT_USERNAME: ${DB_REPORT_USERNAME:-}
      DB_REPORT_PASSWORD: ${DB_REPORT_PASSWORD:-}
      MIGRATION_DIR: /var/www/database/migrations
    command: ["/usr/local/bin/roadops-apply-migrations"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [backend]
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend, egress]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/www/storage/framework/cache:size=32m,uid=10001,gid=10001
      - /var/www/storage/framework/sessions:size=32m,uid=10001,gid=10001
      - /var/www/storage/framework/views:size=32m,uid=10001,gid=10001
      - /var/www/storage/logs:size=64m,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true

  integration-worker:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    restart: unless-stopped
    environment: *api-environment
    command:
      - php
      - artisan
      - queue:work
      - redis_integrations
      - --queue=integrations
      - --sleep=1
      - --tries=5
      - --backoff=15
      - --timeout=900
      - --max-time=3600
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend, egress]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /var/www/storage/framework/cache:size=32m,uid=10001,gid=10001
      - /var/www/storage/framework/sessions:size=8m,uid=10001,gid=10001
      - /var/www/storage/framework/views:size=8m,uid=10001,gid=10001
      - /var/www/storage/logs:size=64m,uid=10001,gid=10001
    stop_grace_period: 930s
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    restart: unless-stopped
    environment: *api-environment
    command:
      - php
      - artisan
      - queue:work
      - --queue=planning,outbox,notifications,default
      - --sleep=1
      - --tries=3
      - --backoff=5
      - --timeout=110
      - --max-time=3600
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend, egress]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /var/www/storage/framework/cache:size=32m,uid=10001,gid=10001
      - /var/www/storage/framework/sessions:size=8m,uid=10001,gid=10001
      - /var/www/storage/framework/views:size=8m,uid=10001,gid=10001
      - /var/www/storage/logs:size=64m,uid=10001,gid=10001
    stop_grace_period: 130s
    security_opt:
      - no-new-privileges:true

  scheduler:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    restart: unless-stopped
    environment: *api-environment
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend, egress]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/www/storage/framework/cache:size=16m,uid=10001,gid=10001
      - /var/www/storage/framework/sessions:size=8m,uid=10001,gid=10001
      - /var/www/storage/framework/views:size=8m,uid=10001,gid=10001
      - /var/www/storage/logs:size=32m,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: infra/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://api-gateway:8080
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    depends_on:
      api-gateway:
        condition: service_healthy
    networks: [frontend]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  api-gateway:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile.api-only
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend, backend]
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,uid=101,gid=101
      - /var/run:size=8m,uid=101,gid=101
    security_opt:
      - no-new-privileges:true

  gateway:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${ROADOPS_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks: [frontend, backend]
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,uid=101,gid=101
      - /var/run:size=8m,uid=101,gid=101
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  redis-data:

networks:
  frontend:
  backend:
    internal: true
  egress:
