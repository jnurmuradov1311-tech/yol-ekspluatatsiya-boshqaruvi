            materials:
              type: array
              items: { $ref: "#/components/schemas/WorkOrderExecutionMaterial" }
            equipment:
              type: array
              items: { $ref: "#/components/schemas/WorkOrderExecutionEquipment" }
        completion:
          oneOf:
            - $ref: "#/components/schemas/WorkOrderCompletion"
            - type: "null"
    WorkOrderCompletionInput:
      type: object
      additionalProperties: false
      required: [completedQuantity, unit, laborEntries, materialUsages, equipmentUsages, evidence]
      properties:
        completedQuantity: { type: string, pattern: "^[0-9]+(?:\\.[0-9]+)?$" }
        unit: { type: string, minLength: 1, maxLength: 50 }
        note: { type: [string, "null"], maxLength: 5000 }
        evidence:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 2048
            pattern: "^https://[^\\s?#]+\\.(?:jpe?g|png|pdf)(?:\\?[^\\s#]*)?$"
            description: Browser-safe JPEG, PNG or PDF URL from a server-configured approved HTTPS evidence origin; private object-store URIs and arbitrary external hosts are rejected.
        laborEntries:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [workerId, workDate, actualMinutes]
            properties:
              workerId: { type: string, format: uuid }
              workDate: { type: string, format: date }
              actualMinutes: { type: integer, minimum: 1, maximum: 420 }
        materialUsages:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [materialReservationId, quantity, usedAt]
            properties:
              materialReservationId: { type: string, format: uuid }
              quantity:
                type: string
                pattern: "^[0-9]+(?:\\.[0-9]+)?$"
                description: Positive final actual consumption for this one-shot reservation; it cannot exceed the reserved quantity, and any unused remainder is released when completion is recorded.
              usedAt:
                type: string
                format: date-time
                description: Actual RFC 3339 timestamp with an explicit UTC offset; date-only values are rejected.
        equipmentUsages:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [equipmentReservationId, usageDate, actualMachineMinutes]
            properties:
              equipmentReservationId: { type: string, format: uuid }
              usageDate: { type: string, format: date }
              actualMachineMinutes:
                type: integer
                minimum: 1
                maximum: 1440
                description: Final one-shot actual for this reservation; it cannot exceed the reserved time window.
