      summary: Submit a draft manual inspection for review
      operationId: submitManualInspection
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: All draft observations submitted together and returned as pending review.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ManualInspection" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/RoadScopeUnavailable" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "419": { $ref: "#/components/responses/CsrfMismatch" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /manual-inspections/{id}/decision:
    post:
      tags: [Findings]
      summary: Review every pending observation in an inspection
      operationId: decideManualInspection
      description: >-
        Atomically applies VERIFIED or REJECTED to all pending observations in the inspection and
        records the review note. A partial inspection-level decision is not accepted.
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualInspectionDecisionInput" }
      responses:
        "200":
          description: Reviewed inspection with its final inspection-level state.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ManualInspection" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/RoadScopeUnavailable" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "419": { $ref: "#/components/responses/CsrfMismatch" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /manual-inspections/{id}/observations/{observationId}/evidence/{index}:
    get:
      tags: [Findings]
      summary: Stream authorized manual-inspection evidence
      operationId: getManualInspectionEvidence
      description: >-
        Streams one checksum-verified object through the authenticated same-origin API.
        The object must stay inside the separately configured manual-inspection S3 bucket
        and prefix. Private S3 references are never returned to the browser.
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - name: observationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: index
          in: path
          required: true
          schema: { type: integer, minimum: 0, maximum: 99 }
        - name: Range
          in: header
          required: false
          description: A single RFC 9110 byte range used for video seeking.
          schema:
            type: string
            pattern: '^bytes=(?:[0-9]+-[0-9]*|-[0-9]+)$'
      responses:
        "200":
          description: Evidence bytes with a private, no-store cache policy.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            video/mp4:
              schema: { type: string, format: binary }
        "206":
          description: The requested single evidence byte range.
          headers:
            Accept-Ranges: { schema: { type: string, const: bytes } }
            Content-Range: { schema: { type: string } }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            video/mp4:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: Evidence is empty or exceeds the configured maximum size.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "415":
          description: The stored or S3-reported media type is not allow-listed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "416":
          description: The requested evidence byte range is invalid or unsatisfiable.
        "422": { $ref: "#/components/responses/ValidationError" }
        "503":
          description: The object store is unavailable or metadata/checksum validation failed closed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

