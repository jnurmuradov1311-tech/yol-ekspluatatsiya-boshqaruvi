                  label: { type: string, minLength: 1 }
                  latitude: { type: number, minimum: -90, maximum: 90 }
                  longitude: { type: number, minimum: -180, maximum: 180 }
        layers:
          type: object
          additionalProperties: false
          required: [elements, defects, workZones]
          properties:
            elements:
              type: array
              items: { $ref: "#/components/schemas/MapFeature" }
            defects:
              type: array
              items: { $ref: "#/components/schemas/MapFeature" }
            workZones:
              type: array
              items: { $ref: "#/components/schemas/MapFeature" }
    ManualInspectionState:
      type: string
      enum: [DRAFT, PENDING_REVIEW, VERIFIED, REJECTED]
    ManualInspectionObservation:
      type: object
      additionalProperties: false
      required: [id, locationLabel, observedIssue, exactQuantity, evidence]
      properties:
        id: { type: string, format: uuid }
        locationLabel: { type: string, minLength: 1 }
        observedIssue: { type: string, minLength: 1 }
        exactQuantity: { $ref: "#/components/schemas/Quantity" }
        laneLabel: { type: [string, "null"], maxLength: 100 }
        evidence:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ManualInspectionEvidenceMedia" }
    ManualInspectionEvidenceMedia:
      type: object
      additionalProperties: false
      required: [index, contentType, capturedAt, sha256, url]
      properties:
        index: { type: integer, minimum: 0, maximum: 19 }
        contentType: { type: string, enum: [image/jpeg, image/png, video/mp4] }
        capturedAt: { type: string, format: date-time }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
        url:
          type: string
          pattern: "^/api/v1/manual-inspections/[0-9a-fA-F-]{36}/observations/[0-9a-fA-F-]{36}/evidence/(?:0|[1-9][0-9]?)$"
    ManualInspection:
      type: object
      additionalProperties: false
      required:
        - id
        - inspectionNumber
        - road
        - division
        - observedDate
        - inspectorName
        - state
        - observations
      properties:
        id: { type: string, format: uuid }
        inspectionNumber: { type: string, minLength: 1 }
        road: { $ref: "#/components/schemas/RoadRef" }
        division: { $ref: "#/components/schemas/DivisionRef" }
        observedDate: { type: string, format: date }
        inspectorName: { type: string, minLength: 1 }
        state: { $ref: "#/components/schemas/ManualInspectionState" }
        observations:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ManualInspectionObservation" }
        note: { type: [string, "null"], maxLength: 5000 }
        reviewerNote: { type: [string, "null"], maxLength: 5000 }
        submittedAt: { type: [string, "null"], format: date-time }
        reviewedAt: { type: [string, "null"], format: date-time }
    PagedManualInspections:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ManualInspection" }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    ManualInspectionWorkTopic:
      type: object
      additionalProperties: false
      required: [id, name, topicNumber]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        topicNumber: { type: integer, minimum: 1, maximum: 29 }
    ManualInspectionMeasurementUnit:
      type: object
      additionalProperties: false
      required: [value, label]
      properties:
        value: { type: string, enum: [m, m2, m3, unit, km] }
        label: { type: string, minLength: 1 }
    ManualInspectionOptions:
      type: object
      additionalProperties: false
      required: [roads, workTopics, measurementUnits]
      properties:
        roads:
          type: array
          description: Effective YTP roads assigned to the caller's division scope.
          items: { $ref: "#/components/schemas/Road" }
        workTopics:
          type: array
          minItems: 29
          maxItems: 29
          items: { $ref: "#/components/schemas/ManualInspectionWorkTopic" }
        measurementUnits:
          type: array
          minItems: 5
          maxItems: 5
          items: { $ref: "#/components/schemas/ManualInspectionMeasurementUnit" }
    ManualInspectionEvidenceInput:
      type: object
      additionalProperties: false
      required: [objectUri, contentType, sha256, capturedAt]
      properties:
        objectUri:
          type: string
          format: uri
          maxLength: 2048
          description: Server-approved private object reference; never rendered directly by the browser.
        contentType: { type: string, enum: [image/jpeg, image/png, video/mp4] }
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: Lowercase full-object SHA-256; S3 must expose the same value as a native FULL_OBJECT checksum.
        capturedAt: { type: string, format: date-time }
        latitude:
          type: [number, "null"]
          minimum: -90
          maximum: 90
          description: WGS84 latitude; latitude and longitude are supplied together.
        longitude:
          type: [number, "null"]
          minimum: -180
          maximum: 180
          description: WGS84 longitude; latitude and longitude are supplied together.
    ManualInspectionInput:
      type: object
      additionalProperties: false
      required:
        [roadId, iqnTopicId, observedDate, chainageStartM, exactQuantity, unit]
      properties:
        roadId:
          type: string
          format: uuid
          description: Must identify an effective YTP road in the caller's division for the observed chainage and date.
        iqnTopicId:
          type: string
          format: uuid
          description: Expert-published top-level IQN 02-24 topic selected from manual-inspection options.
        observedDate: { type: string, format: date }
        chainageStartM:
          type: integer
          minimum: 0
          maximum: 2147483646
          description: Single location in metres; the server checks it against the road length effective on observedDate.
        exactQuantity: { type: string, pattern: "^[0-9]+(?:\\.[0-9]+)?$" }
        unit:
          type: string
          enum: [m, m2, m3, unit, km]
        note: { type: [string, "null"], maxLength: 5000 }
        evidence:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ManualInspectionEvidenceInput" }
    ManualInspectionDecisionInput:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [VERIFIED, REJECTED] }
        note:
          type: [string, "null"]
          maxLength: 5000
          description: Rejection requires a non-empty reason; verification may use an empty note.
    TimesheetDayState:
      type: string
      enum: [WORK, LEAVE, SICK, ABSENT, REST, OUTSIDE_ASSIGNMENT]
    MonthlyTimesheetEntry:
      type: object
      additionalProperties: false
      required: [day, minutes, state]
      properties:
        day: { type: integer, minimum: 1, maximum: 31 }
        minutes: { type: integer, minimum: 0, maximum: 420 }
        state: { $ref: "#/components/schemas/TimesheetDayState" }
    MonthlyTimesheetRow:
      type: object
      additionalProperties: false
      required: [workerId, fullName, positionName, entries, totalMinutes]
      properties:
        workerId: { type: string, format: uuid }
        fullName: { type: string, minLength: 1 }
        personnelNumber: { type: string, minLength: 1 }
        positionName: { type: string, minLength: 1 }
        entries:
          type: array
          minItems: 28
          maxItems: 31
          description: Ordered entries for every calendar day 1..daysInMonth with no omissions.
          items: { $ref: "#/components/schemas/MonthlyTimesheetEntry" }
        totalMinutes: { type: integer, minimum: 0 }
    MonthlyTimesheet:
      type: object
      additionalProperties: false
      required: [year, month, daysInMonth, divisionName, rows]
      properties:
        year: { type: integer, minimum: 2020, maximum: 2100 }
        month: { type: integer, minimum: 1, maximum: 12 }
        daysInMonth: { type: integer, minimum: 28, maximum: 31 }
        divisionName: { type: string, minLength: 1 }
        rows:
          type: array
          items: { $ref: "#/components/schemas/MonthlyTimesheetRow" }
    Settings:
      type: object
      additionalProperties: false
      required: [timezone, planningHorizonDays]
      properties:
        timezone: { type: string, const: Asia/Tashkent }
        planningHorizonDays:
          type: string
          pattern: "^(?:[1-9]|[1-8][0-9]|90)$"
    SettingsUpdateInput:
      type: object
      additionalProperties: false
      required: [timezone, planningHorizonDays]
      properties:
        timezone: { type: string, const: Asia/Tashkent }
        planningHorizonDays: { type: integer, minimum: 1, maximum: 90 }
    IntegrationReadiness:
      type: object
      additionalProperties: false
      required: [code, name, supplies, state, lastSuccessfulSyncAt, lastAttemptAt, message, requiredActions]
      properties:
        code: { type: string, enum: [ROAD_REPAIR_POINT, ROADVISION, SUPABASE] }
        name: { type: string }
        supplies:
          type: array
          items: { type: string }
        state:
          type: string
          enum: [READY, NEEDS_CONFIGURATION, SYNCING, ERROR, DISABLED]
        lastSuccessfulSyncAt: { type: [string, "null"], format: date-time }
        lastAttemptAt: { type: [string, "null"], format: date-time }
        message: { type: string }
        requiredActions:
          type: array
          items: { type: string }
        mode: { type: string, enum: [s3_manifest, vendor_api] }
    WebhookReceiptEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required: [id, duplicate]
              properties:
                id: { type: string, format: uuid }
                duplicate: { type: boolean }

security:
  - sessionCookie: []
