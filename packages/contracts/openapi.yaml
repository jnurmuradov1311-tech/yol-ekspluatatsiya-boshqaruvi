      summary: List manual inspections by workflow state
      operationId: listManualInspections
      parameters:
        - name: state
          in: query
          required: false
          schema:
            allOf:
              - $ref: "#/components/schemas/ManualInspectionState"
            default: DRAFT
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Manual inspections on roads in the caller's road-unit scope and selected state.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PagedManualInspections" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/RoadScopeUnavailable" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Findings]
      summary: Create a manual inspection
      operationId: createManualInspection
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualInspectionInput" }
      responses:
        "201":
          description: Inspection created as an auditable operational record.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [id]
                        properties:
                          id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/RoadScopeUnavailable" }
        "409": { $ref: "#/components/responses/Conflict" }
        "419": { $ref: "#/components/responses/CsrfMismatch" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /manual-inspections/options:
    get:
      tags: [Findings]
      summary: Read manual-inspection entry options
      operationId: getManualInspectionOptions
      description: >-
        Returns active YTP roads in the caller's division, all 29 expert-published
        top-level IQN 02-24 work topics and the allowed measurement units. A create
        request records one selected topic and a single chainage point; the executable
        IQN variant is selected later during planning.
      responses:
        "200":
          description: Synchronized scoped roads, IQN work topics and measurement units available to the caller.
          content:
            application/json:
