          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RoadMapData" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/RoadScopeUnavailable" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /settings:
    get:
      tags: [Administration]
      summary: Read operational settings
      operationId: getSettings
      responses:
        "200":
          description: Non-secret operational settings.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Settings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [Administration]
      summary: Update global operational settings
      operationId: updateSettings
      description: Requires system.all granted by a global, divisionless membership; a division-scoped wildcard cannot change Republic-wide configuration.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsUpdateInput" }
      responses:
        "200":
          description: Non-secret operational settings updated and audited.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Settings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "419": { $ref: "#/components/responses/CsrfMismatch" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /integrations/readiness:
    get:
      tags: [Integrations]
      summary: Read integration readiness
      operationId: getIntegrationReadiness
      responses:
        "200":
          description: Configuration and contract gates; never reports a fake successful connection.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/IntegrationReadiness" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /integrations/{code}/sync:
    post:
      tags: [Integrations]
      summary: Queue an integration sync
      operationId: runIntegrationSync
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, enum: [ROAD_REPAIR_POINT, ROADVISION] }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: A sync run was queued after readiness validation.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/IntegrationReadiness" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "419": { $ref: "#/components/responses/CsrfMismatch" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /integrations/ytp/webhook:
    post:
      tags: [Integrations]
      summary: Receive a signed YTP event
      operationId: receiveYtpWebhook
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookTimestamp"
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./external/ytp/proposed-event.schema.json"
      responses:
        "202": { $ref: "#/components/responses/WebhookAccepted" }
        "200": { $ref: "#/components/responses/WebhookDuplicate" }
        "401": { $ref: "#/components/responses/SignatureInvalid" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /integrations/roadvision/webhook:
    post:
      tags: [Integrations]
      summary: Receive a signed RoadVision event
      operationId: receiveRoadVisionWebhook
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookTimestamp"
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./external/roadvision/proposed-result-event.schema.json"
      responses:
        "202": { $ref: "#/components/responses/WebhookAccepted" }
        "200": { $ref: "#/components/responses/WebhookDuplicate" }
        "401": { $ref: "#/components/responses/SignatureInvalid" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: roadops_session

  parameters:
    EntityId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 32 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    WebhookTimestamp:
      name: X-RoadOps-Timestamp
      in: header
      required: true
      description: Unix seconds; accepted only within a five-minute replay window.
      schema: { type: string, pattern: "^[0-9]{10}$" }
    WebhookSignature:
      name: X-RoadOps-Signature
      in: header
      required: true
      description: Lowercase hex HMAC-SHA256 of `{timestamp}.{raw_body}`, optionally prefixed by `sha256=`.
      schema: { type: string, pattern: "^(sha256=)?[a-f0-9]{64}$" }

  responses:
    Unauthenticated:
      description: Session is absent, expired or revoked.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: Authenticated user lacks the permission or road-unit scope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Entity does not exist in the caller's scope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: State, idempotency payload or snapshot revision conflict.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RoadScopeUnavailable:
      description: >-
        Operational processing is fail-closed because the requested road is missing, ambiguous,
        inactive or outside the authenticated actor's division scope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    CsrfMismatch:
      description: CSRF cookie/header pair is missing or mismatched.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ValidationError:
      description: Request cannot be processed as supplied.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    SignatureInvalid:
      description: Webhook signature is missing, stale or invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    WebhookAccepted:
      description: Event persisted durably and queued for processing.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WebhookReceiptEnvelope" }
    WebhookDuplicate:
      description: The same event ID and exact payload were already persisted.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WebhookReceiptEnvelope" }

  schemas:
    SuccessEnvelope:
      type: object
      required: [data]
      properties:
        data: {}
        meta:
          type: object
          additionalProperties: false
          properties:
            requestId: { type: string, format: uuid }
      additionalProperties: false
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, pattern: "^[A-Z][A-Z0-9_]*$" }
            message: { type: string, minLength: 1 }
            details:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
            requestId: { type: string, format: uuid }
      additionalProperties: false
    HealthEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [service, status, database, time]
          properties:
            service: { type: string, const: roadops-api }
            status: { type: string, enum: [ok, degraded] }
            database: { type: string, enum: [ok, failed] }
            time: { type: string, format: date-time }
      additionalProperties: false
    UserEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/User" }
    MfaChallengeEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/MfaChallenge" }
    MfaChallenge:
      type: object
      additionalProperties: false
      required: [mfaRequired, factorType]
      properties:
        mfaRequired: { type: boolean, const: true }
        factorType: { type: string, const: totp }
    User:
      type: object
      additionalProperties: false
      required: [id, fullName, roleLabel, permissions, globalPermissions]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string, minLength: 1 }
        roleLabel: { type: string, minLength: 1 }
        division:
          oneOf:
            - $ref: "#/components/schemas/DivisionRef"
            - type: "null"
        permissions:
          type: array
          uniqueItems: true
          items: { type: string }
        globalPermissions:
          type: array
          uniqueItems: true
          description: Permissions granted by an active membership without a division scope.
          items: { type: string }
    DivisionRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
    RoadRef:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 50 }
        name: { type: string, minLength: 1 }
    Quantity:
      type: object
      additionalProperties: false
      required: [value, unit]
      properties:
        value: { type: string, pattern: "^[0-9]+(?:\\.[0-9]+)?$" }
        unit: { type: string, minLength: 1, maxLength: 30 }
    RoadVisionDecisionInput:
      oneOf:
        - type: object
          title: Verify a finding
          additionalProperties: false
          required: [decision, measuredQuantity]
          properties:
            decision: { type: string, const: VERIFIED }
            note: { type: [string, "null"], maxLength: 5000 }
            measuredQuantity: { $ref: "#/components/schemas/Quantity" }
        - type: object
          title: Reject or mark a duplicate
          additionalProperties: false
          required: [decision, note]
          properties:
            decision: { type: string, enum: [REJECTED, DUPLICATE] }
            note: { type: string, minLength: 1, maxLength: 5000 }
            measuredQuantity:
              oneOf:
                - $ref: "#/components/schemas/Quantity"
                - type: "null"
    DashboardSummary:
      type: object
      additionalProperties: false
      required: [asOf, division, counts, alerts, activity]
      properties:
        asOf: { type: string, format: date-time }
        division:
          oneOf:
            - $ref: "#/components/schemas/DivisionRef"
            - type: "null"
        counts:
          type: object
          additionalProperties: false
          required:
            - reviewQueue
            - confirmedDefects
            - plannedToday
            - openWorkOrders
            - overdueWorkOrders
            - workersOnShift
            - availableEquipment
            - failedSyncs
          properties:
            reviewQueue: { type: integer, minimum: 0 }
            confirmedDefects: { type: integer, minimum: 0 }
            plannedToday: { type: integer, minimum: 0 }
            openWorkOrders: { type: integer, minimum: 0 }
            overdueWorkOrders: { type: integer, minimum: 0 }
            workersOnShift: { type: integer, minimum: 0 }
            availableEquipment: { type: integer, minimum: 0 }
            failedSyncs: { type: integer, minimum: 0 }
        alerts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, kind, title, detail]
            properties:
              id: { type: string }
              kind: { type: string, enum: [danger, warning, info] }
              title: { type: string }
              detail: { type: string }
              href: { type: string }
        activity:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, occurredAt, actor, action, subject]
            properties:
              id: { type: string }
              occurredAt: { type: string, format: date-time }
              actor: { type: string }
              action: { type: string }
              subject: { type: string }
    AdminNetworkSummary:
      type: object
      additionalProperties: false
      required:
        - asOf
        - officialNetworkLengthKm
        - synchronizedRoadLengthKm
        - synchronizedRoadCount
        - synchronizedDivisionCount
      properties:
        asOf: { type: string, format: date-time }
        officialNetworkLengthKm:
          type: integer
          const: 42371
          description: Official national administrative baseline; never exposed by division endpoints.
        synchronizedRoadLengthKm:
          type: string
          pattern: "^[0-9]+(?:\\.[0-9]+)?$"
          description: Sum of effective source-owned road lengths, expressed in kilometres.
        synchronizedRoadCount: { type: integer, minimum: 0 }
        synchronizedDivisionCount: { type: integer, minimum: 0 }
    IqnReviewApprovalInput:
      type: object
      additionalProperties: false
      required: [manifest, confirmation]
      properties:
        manifest:
          type: object
          description: >-
            Complete document, block_decisions, row_decisions and catalog body.
            reviewer_attestation is forbidden because the server creates it.
          additionalProperties: true
        confirmation:
          type: string
          const: IQN_CATALOG_REVIEW_APPROVED
    IqnReviewApproval:
      type: object
      additionalProperties: false
      required:
        - reviewId
        - importBatchId
        - documentKind
        - reviewedBy
        - reviewerSessionId
        - confirmedAt
        - expiresAt
        - sourceSha256
        - canonicalManifestSha256
        - confirmation
      properties:
        reviewId: { type: string, format: uuid }
        importBatchId: { type: string, format: uuid }
        documentKind: { type: string, enum: [iqn_02, iqn_03] }
        reviewedBy: { type: string, format: uuid }
        reviewerSessionId: { type: string, format: uuid }
        confirmedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        sourceSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        canonicalManifestSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        confirmation: { type: string, const: IQN_CATALOG_REVIEW_APPROVED }
    OrganizationHierarchyLevel:
      type: string
      enum: [REPUBLIC, REGION, ENTERPRISE, DIVISION]
    OrganizationHierarchyNode:
      type: object
      additionalProperties: false
      required: [id, externalId, code, name, level, children]
      properties:
        id: { type: string, format: uuid }
        externalId:
          type: string
          minLength: 1
          description: Stable identifier supplied by the authoritative source.
        code: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        level: { $ref: "#/components/schemas/OrganizationHierarchyLevel" }
        officialNetworkLengthKm:
          type: integer
          const: 42371
          description: Present only on the synchronized Republic root.
        children:
          type: array
          items: { $ref: "#/components/schemas/OrganizationHierarchyNode" }
    UnlinkedOrganizationHierarchyNode:
      type: object
      additionalProperties: false
      required: [id, externalId, code, name, level, reason]
      properties:
        id: { type: string, format: uuid }
        externalId: { type: string, minLength: 1 }
        code: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        level: { $ref: "#/components/schemas/OrganizationHierarchyLevel" }
        reason:
          type: string
          enum:
            - ORGANIZATION_VERSION_MISSING_OR_INEFFECTIVE
            - DIVISION_VERSION_MISSING_OR_INEFFECTIVE
            - REPUBLIC_PARENT_MISSING_OR_INEFFECTIVE
            - REGION_CHAIN_MISSING_OR_INEFFECTIVE
            - ENTERPRISE_CHAIN_MISSING_OR_INEFFECTIVE
    AdminOrganizationHierarchy:
      type: object
      additionalProperties: false
      required: [asOf, officialNetworkLengthKm, summary, tree, unlinkedNodes]
      properties:
        asOf: { type: string, format: date-time }
        officialNetworkLengthKm:
          type: integer
          const: 42371
          description: Official Republic-level administrative baseline.
        summary:
          type: object
          additionalProperties: false
          required:
            - synchronizedRepublicCount
            - synchronizedRegionCount
            - synchronizedEnterpriseCount
            - synchronizedDivisionCount
            - unlinkedNodeCount
            - hierarchyComplete
          properties:
            synchronizedRepublicCount: { type: integer, minimum: 0 }
            synchronizedRegionCount: { type: integer, minimum: 0 }
            synchronizedEnterpriseCount: { type: integer, minimum: 0 }
            synchronizedDivisionCount: { type: integer, minimum: 0 }
            unlinkedNodeCount: { type: integer, minimum: 0 }
            hierarchyComplete:
              type: boolean
              description: True only with exactly one Republic and no unlinked current node.
        tree:
          type: array
          description: Synchronized Republic roots with Region, Enterprise and Division children.
          items: { $ref: "#/components/schemas/OrganizationHierarchyNode" }
        unlinkedNodes:
          type: array
          description: Synchronized current records omitted from the connected tree because a source link is missing or ineffective.
          items: { $ref: "#/components/schemas/UnlinkedOrganizationHierarchyNode" }
    FindingState:
      type: string
      enum: [PENDING_REVIEW, VERIFIED, REJECTED, DUPLICATE]
    RoadVisionFinding:
      type: object
      additionalProperties: false
      required:
        - id
        - vendorReference
        - attributeName
        - road
        - division
        - chainageStartM
        - observedAt
        - receivedAt
        - state
        - evidence
      properties:
        id: { type: string, format: uuid }
        vendorReference: { type: string, minLength: 1 }
        attributeName: { type: string, minLength: 1 }
        road: { $ref: "#/components/schemas/RoadRef" }
        division: { $ref: "#/components/schemas/DivisionRef" }
        chainageStartM: { type: number, minimum: 0 }
        chainageEndM: { type: number, minimum: 0 }
        laneLabel: { type: [string, "null"], maxLength: 100 }
        observedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        state: { $ref: "#/components/schemas/FindingState" }
        measuredQuantity: { $ref: "#/components/schemas/Quantity" }
        evidence:
          type: array
          maxItems: 100
          description: Every complete vendor media entry, with no private object URI.
          items: { $ref: "#/components/schemas/RoadVisionEvidenceMedia" }
        reviewerNote: { type: string, maxLength: 5000 }
    RoadVisionEvidenceMedia:
      type: object
      additionalProperties: false
      required: [index, contentType, capturedAt, sha256, url]
      properties:
        index: { type: integer, minimum: 0, maximum: 99 }
        mediaId: { type: [string, "null"], maxLength: 200 }
        contentType: { type: string, enum: [image/jpeg, image/png, video/mp4] }
        capturedAt: { type: string, format: date-time }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        url:
          type: string
          pattern: "^/api/v1/roadvision/findings/[0-9a-fA-F-]{36}/evidence/(?:0|[1-9][0-9]?)$"
    PagedRoadVisionFindings:
      $ref: "#/components/schemas/PagedCollectionRoadVisionFinding"
    PagedCollectionRoadVisionFinding:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RoadVisionFinding" }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    ConfirmedDefectState:
      type: string
      enum: [OPEN, PLANNED, IN_PROGRESS, RESOLVED, CLOSED, CANCELLED]
    ConfirmedDefect:
      type: object
      additionalProperties: false
      required:
        - id
        - sourceKind
        - sourceReference
        - road
        - division
        - observedAt
        - locationLabel
        - chainageStartM
        - chainageEndM
        - defectName
        - exactQuantity
        - state
      properties:
        id: { type: string, format: uuid }
        sourceKind: { type: string, enum: [ROADVISION, MANUAL_INSPECTION] }
        sourceReference: { type: string, minLength: 1 }
        road: { $ref: "#/components/schemas/RoadRef" }
        division: { $ref: "#/components/schemas/DivisionRef" }
        observedAt: { type: string, format: date-time }
        locationLabel: { type: string, minLength: 1 }
        chainageStartM: { type: number, minimum: 0 }
        chainageEndM: { type: number, minimum: 0 }
        defectName: { type: string, minLength: 1 }
        exactQuantity: { $ref: "#/components/schemas/Quantity" }
        state: { $ref: "#/components/schemas/ConfirmedDefectState" }
    PagedConfirmedDefects:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ConfirmedDefect" }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    PlanningCandidate:
      type: object
      additionalProperties: false
      required:
        - id
        - sourceReference
        - sourceKind
        - road
        - locationLabel
        - workName
        - exactQuantity
        - normReference
        - verificationState
      properties:
        id: { $ref: "#/components/schemas/PlanningCandidateId" }
        sourceReference: { type: string }
        sourceKind: { type: string, enum: [ROADVISION, MANUAL_INSPECTION, ANNUAL_PROGRAM] }
        road: { $ref: "#/components/schemas/RoadRef" }
        locationLabel: { type: string }
        workName: { type: string }
        exactQuantity:
          oneOf:
            - $ref: "#/components/schemas/Quantity"
            - type: "null"
        normReference:
          type: [string, "null"]
        verificationState: { type: string, enum: [VERIFIED, APPROVED] }
    PagedPlanningCandidates:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PlanningCandidate" }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    PlanBlocker:
      type: object
      additionalProperties: false
      required: [code, title, explanation, resolution, level]
      properties:
        code: { type: string, pattern: "^[A-Z][A-Z0-9_]*$" }
        title: { type: string }
        explanation: { type: string }
        resolution: { type: string }
        candidateId:
          oneOf:
            - $ref: "#/components/schemas/PlanningCandidateId"
            - type: "null"
        level: { type: string, enum: [BLOCKING, NOTICE] }
    PlanningCandidateId:
      type: string
      description: >-
        Stable prefixed planning identifier. A bare UUID is invalid because its source namespace
        would be ambiguous. MANUAL identifies a persisted manual-preview job.
      pattern: "^(?:DEFECT|ANNUAL|MANUAL):[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$"
    PlanningRunState:
      type: string
      enum: [DRAFT, EVALUATED, APPROVED, PUBLISHED, CANCELLED, SUPERSEDED]
    PlanningRunSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - state
        - planningMode
        - dateFrom
        - dateTo
        - itemCount
        - blockerCount
        - createdAt
        - createdByName
        - createdByMe
        - canApprove
        - canPublish
      properties:
        id: { type: string, format: uuid }
        state: { $ref: "#/components/schemas/PlanningRunState" }
        planningMode: { type: string, enum: [AUTOMATIC, MANUAL] }
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date }
        itemCount: { type: integer, minimum: 0 }
        blockerCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        createdByName: { type: string, minLength: 1 }
        createdByMe: { type: boolean }
        canApprove: { type: boolean }
        canPublish: { type: boolean }
    SafetySchemeCode:
      type: string
      enum:
        - ROAD_SHOULDER_WORK
        - SINGLE_LANE_CLOSURE
        - HALF_ROAD_CLOSURE
        - ALTERNATING_TRAFFIC
        - FULL_CLOSURE
    SafetyScheme:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - name
        - description
        - requiredSafetyWorkers
        - requiredSigns
        - requiredCones
        - requiredBarriers
        - requiresPermit
      properties:
        id: { type: string, format: uuid }
        code: { $ref: "#/components/schemas/SafetySchemeCode" }
        name: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        requiredSafetyWorkers: { type: integer, minimum: 0 }
        requiredSigns: { type: integer, minimum: 0 }
        requiredCones: { type: integer, minimum: 0 }
        requiredBarriers: { type: integer, minimum: 0 }
        requiresPermit: { type: boolean }
    PlanningWorkOption:
      type: object
      additionalProperties: false
      required: [id, code, name, normReference, unit, requiredWorkers, laborMinutesPerUnit]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        normReference: { type: string, minLength: 1 }
        unit: { type: string, minLength: 1, maxLength: 30 }
        requiredWorkers: { type: integer, minimum: 1 }
        laborMinutesPerUnit: { type: number, exclusiveMinimum: 0 }
    PlanningWorkerOption:
      type: object
      additionalProperties: false
      required: [id, fullName, positionName, skills, availableMinutes]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string, minLength: 1 }
        positionName: { type: string, minLength: 1 }
        skills:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
        availableMinutes:
          type: integer
          minimum: 0
          maximum: 420
          description: Remaining minutes for the selected local work day.
    PlanningOptions:
      type: object
      additionalProperties: false
      required: [road, workVariants, safetySchemes, workers]
      properties:
        road: { $ref: "#/components/schemas/Road" }
        workVariants:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PlanningWorkOption" }
        safetySchemes:
          type: array
          minItems: 5
          maxItems: 5
          description: The five supported road-work traffic-safety schemes, one per SafetySchemeCode.
          items: { $ref: "#/components/schemas/SafetyScheme" }
        workers:
          type: array
          items: { $ref: "#/components/schemas/PlanningWorkerOption" }
    ResourceCheck:
      type: object
      additionalProperties: false
      required: [kind, label, required, available, sufficient]
      properties:
        kind:
          type: string
          enum: [WORKERS, WORKER_TIME, EQUIPMENT, MATERIALS, SAFETY_EQUIPMENT, PERMIT]
        label: { type: string, minLength: 1 }
        required: { type: string, minLength: 1 }
        available: { type: string, minLength: 1 }
        sufficient:
          type: boolean
          description: Green when true and red when false; no numeric priority or confidence score.
        detail: { type: string }
    WorkerMinutesRemaining:
      type: object
      additionalProperties: false
      required: [workerId, fullName, beforeMinutes, assignedMinutes, remainingMinutes]
      properties:
        workerId: { type: string, format: uuid }
        fullName: { type: string, minLength: 1 }
        beforeMinutes: { type: integer, minimum: 0, maximum: 420 }
        assignedMinutes: { type: integer, minimum: 0, maximum: 420 }
        remainingMinutes: { type: integer, minimum: 0, maximum: 420 }
    ManualPlanInput:
      type: object
      additionalProperties: false
      required:
        - roadId
        - workVariantId
        - exactQuantity
        - chainageStartM
        - scheduledDate
        - safetySchemeId
        - workerIds
      properties:
        roadId:
          type: string
          format: uuid
          description: Must identify an effective YTP road in the caller's division for the requested chainage and date.
        workVariantId: { type: string, format: uuid }
        exactQuantity: { type: string, pattern: "^[0-9]+(?:\\.[0-9]+)?$" }
        chainageStartM:
          type: string
          pattern: "^[0-9]+(?:\\.[0-9]+)?$"
          description: Single point location in metres within the selected road's synchronized length.
        chainageEndM:
          type: [string, "null"]
          pattern: "^[0-9]+(?:\\.[0-9]+)?$"
          description: Deprecated compatibility field; when provided it must equal chainageStartM because manual planning accepts one point only.
        laneLabel: { type: [string, "null"], minLength: 1, maxLength: 100 }
        direction: { type: [string, "null"], minLength: 1, maxLength: 50 }
        sourceDefectId: { type: [string, "null"], format: uuid }
        scheduledDate: { type: string, format: date }
        safetySchemeId: { type: string, format: uuid }
        workerIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
        permitNumber: { type: string, minLength: 1, maxLength: 200 }
    PlanPreview:
      type: object
      additionalProperties: false
      required:
        - draftId
        - state
        - dateFrom
        - dateTo
        - planningMode
        - createdByName
        - createdAt
        - jobs
        - blockers
        - resourceChecks
        - workerMinutesRemaining
        - safetyScheme
        - resourcesReady
        - canApprove
        - canPublish
      properties:
        draftId: { type: string, format: uuid }
        state:
          type: string
          enum: [AWAITING_APPROVAL, APPROVED, PUBLISHED]
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date }
        planningMode: { type: string, enum: [AUTOMATIC, MANUAL] }
        createdByName: { type: string, minLength: 1 }
        createdAt: { type: string, format: date-time }
        jobs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [candidateId, workName, scheduledDate, teamName, laborHours, equipment, materials]
            properties:
              candidateId: { $ref: "#/components/schemas/PlanningCandidateId" }
              workName: { type: string }
              scheduledDate: { type: [string, "null"], format: date }
              teamName: { type: [string, "null"] }
              laborHours: { type: string, pattern: "^[0-9]+(?:\\.[0-9]+)?$" }
              equipment:
                type: array
                items: { type: string }
              materials:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [name, quantity, unit]
                  properties:
                    name: { type: string }
                    quantity: { type: string, pattern: "^[0-9]+(?:\\.[0-9]+)?$" }
                    unit: { type: string }
        blockers:
          type: array
          items: { $ref: "#/components/schemas/PlanBlocker" }
        resourceChecks:
          type: array
          items: { $ref: "#/components/schemas/ResourceCheck" }
        workerMinutesRemaining:
          type: array
          items: { $ref: "#/components/schemas/WorkerMinutesRemaining" }
        safetyScheme:
          oneOf:
            - $ref: "#/components/schemas/SafetyScheme"
            - type: "null"
        resourcesReady:
          type: boolean
          description: True only when every persisted blocker and resource gate is clear.
        canApprove:
          type: boolean
          description: True only for a different, currently authorized approver.
        canPublish:
          type: boolean
          description: True only when the current actor may publish this approved, unblocked plan.
    PlanApproveEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required: [planId, state]
              properties:
                planId: { type: string, format: uuid }
                state: { type: string, const: APPROVED }
    PlanPublishEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [planId, state]
          properties:
            planId: { type: string, format: uuid }
            state: { type: string, const: PUBLISHED }
        meta:
          type: object
          additionalProperties: false
          required: [createdWorkOrders]
          properties:
            createdWorkOrders: { type: integer, minimum: 0 }
            requestId: { type: string, format: uuid }
    WorkOrder:
      type: object
      additionalProperties: false
      required: [id, number, workName, road, locationLabel, scheduledDate, teamName, state, exactQuantity]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
