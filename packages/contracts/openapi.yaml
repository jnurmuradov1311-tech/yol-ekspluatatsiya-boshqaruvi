  /timesheets/monthly:
    get:
      tags: [Resources]
      summary: Read a dedicated monthly timesheet grid
      operationId: getMonthlyTimesheet
      description: >-
        Returns one row per worker and exactly one day entry from 1 through the selected month's
        final calendar day. Minutes use the seven-hour (420-minute) working-day cap; non-working
        states remain explicit instead of being inferred from blank cells.
      parameters:
        - name: year
          in: query
          required: true
          schema: { type: integer, minimum: 2020, maximum: 2100 }
        - name: month
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        "200":
          description: Monthly 1..month-end timesheet grid in the caller's road-unit scope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MonthlyTimesheet" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/RoadScopeUnavailable" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /resources/{kind}:
