openapi: 3.1.0
info:
  title: RoadOps API
  version: 1.0.0
  description: >-
    Yo'l ekspluatatsiyasini boshqarish tizimining brauzer va integratsiya API si.
    RoadVision yozuvi faqat ko'rik navbatiga tushadi; inson tasdig'isiz nuqson yoki
    reja yaratilmaydi. API ustuvorlik balli, holat indeksi, 0-100 bahosi yoki AI
    ishonch foizini qabul qilmaydi va qaytarmaydi. Operatsion ko'lam YTPdagi yagona
    D001 yo'li va uning to'liq 67 000 metr uzunligi bilan qat'iy cheklangan.
  contact:
    name: RoadOps platform team
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: Same-origin web gateway
tags:
  - name: Health
    description: Service liveness and required dependency state.
  - name: Authentication
    description: Opaque server-side sessions and CSRF lifecycle.
  - name: Operations
    description: Scoped operational overview and map records.
  - name: Findings
    description: RoadVision review and manual inspection intake.
  - name: Planning
    description: Deterministic previews, blockers and explicit publication.
  - name: Work orders
    description: Published work execution records.
  - name: Annual program
    description: IQN resource quantities without price formation.
  - name: Resources
    description: Source-owned roads, workers and operational resources.
  - name: Reports
    description: Authorized operational XLSX and PDF exports.
  - name: Integrations
    description: Fail-closed source readiness, sync and signed webhooks.
  - name: Administration
    description: Non-secret, audited operational settings.

paths:
  /health:
    get:
      tags: [Health]
      summary: Read API health
      operationId: getHealth
      security: []
      responses:
        "200":
          description: API and database are healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
        "503":
          description: API is running but a required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/csrf:
    get:
      tags: [Authentication]
      summary: Issue a CSRF token
      operationId: getCsrfToken
      responses:
        "200":
          description: Issues the readable SameSite CSRF cookie and mirrors the token in the body.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [csrfToken]
                        properties:
                          csrfToken: { type: string, minLength: 32 }
        "429": { $ref: "#/components/responses/RateLimited" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/login:
    post:
      tags: [Authentication]
      summary: Start an authenticated session
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 12, maxLength: 1024, writeOnly: true }
                totpCode:
                  type: string
                  pattern: "^[0-9]{6}$"
                  writeOnly: true
      responses:
        "200":
          description: Issues opaque session and CSRF cookies after all authentication factors pass.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "202":
          description: Primary credentials passed and a TOTP code is required; no session is issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaChallengeEnvelope"
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/me:
    get:
      tags: [Authentication]
      summary: Read the current user
      operationId: getCurrentUser
      responses:
        "200":
          description: Current user and scoped permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current session
      operationId: logout
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Session revoked and cookies expired.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [loggedOut]
                        properties:
                          loggedOut: { type: boolean, const: true }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "419": { $ref: "#/components/responses/CsrfMismatch" }

  /dashboard/summary:
    get:
      tags: [Operations]
      summary: Read the operational dashboard
      operationId: getDashboardSummary
      responses:
        "200":
          description: Counts and operational alerts in the caller's road-unit scope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DashboardSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/PrimaryRoadUnavailable" }

  /roadvision/findings:
    get:
      tags: [Findings]
      summary: List RoadVision observations
      operationId: listRoadVisionFindings
      parameters:
        - name: state
          in: query
          required: false
          schema:
            allOf:
              - $ref: "#/components/schemas/FindingState"
            default: PENDING_REVIEW
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Vendor observations in the human review lifecycle.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PagedRoadVisionFindings"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/PrimaryRoadUnavailable" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /roadvision/findings/{id}/decision:
    post:
      tags: [Findings]
      summary: Record a human finding decision
      operationId: decideRoadVisionFinding
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoadVisionDecisionInput"
      responses:
        "200":
          description: Human decision was persisted with an audit event.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RoadVisionFinding" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "419": { $ref: "#/components/responses/CsrfMismatch" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /roadvision/findings/{id}/evidence:
    get:
      tags: [Findings]
      summary: Stream authorized RoadVision evidence
      operationId: getRoadVisionFindingEvidence
      description: >-
        Streams an allow-listed object from the configured RoadVision bucket through the
        authenticated same-origin API. The vendor object reference is never exposed to the browser.
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - name: Range
          in: header
          required: false
          description: A single RFC 9110 byte range used for video seeking.
          schema:
            type: string
            pattern: '^bytes=(?:[0-9]+-[0-9]*|-[0-9]+)$'
      responses:
        "200":
          description: Evidence bytes with a private, no-store cache policy.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            video/mp4:
              schema: { type: string, format: binary }
        "206":
          description: The requested single evidence byte range.
          headers:
            Accept-Ranges: { schema: { type: string, const: bytes } }
            Content-Range: { schema: { type: string } }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            video/mp4:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: Evidence is empty or exceeds the configured maximum size.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "415":
          description: The stored evidence media type is not allow-listed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "416":
          description: The requested evidence byte range is invalid or unsatisfiable.
        "422": { $ref: "#/components/responses/ValidationError" }
        "503":
          description: >-
            The D001 operational invariant failed or the configured RoadVision object store
            is temporarily unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /defects:
    get:
      tags: [Findings]
      summary: List confirmed defects
      operationId: listConfirmedDefects
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
            enum: [OPEN, PLANNED, IN_PROGRESS, RESOLVED, CLOSED, CANCELLED]
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Human-confirmed defects on YTP roads within the caller's road-unit scope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PagedConfirmedDefects" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/PrimaryRoadUnavailable" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /planning/candidates:
    get:
      tags: [Planning]
      summary: List eligible D001 planning candidates
      operationId: listPlanningCandidates
      parameters:
        - name: roadUnitId
          in: query
          required: false
          description: Optional road-unit restriction; it must belong to the authenticated caller's scope.
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Explicitly eligible D001 planning inputs; ordering is not a hidden score.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PagedPlanningCandidates" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/PrimaryRoadUnavailable" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /planning/options:
    get:
      tags: [Planning]
      summary: Read manual-planning options for D001
      operationId: getPlanningOptions
      description: >-
        Returns the single effective D001 YTP road (exactly 67 000 m), manual work variants, the five approved
        traffic-safety schemes and workers with their remaining daily availability. Worker
        availability is capped at 420 minutes per local working day.
      parameters:
        - name: roadId
          in: query
          required: false
          description: Optional current YTP identifier for D001; when supplied it must match the single effective D001 row.
          schema: { type: string, format: uuid }
        - name: scheduledDate
          in: query
          required: false
          description: Local work date used to calculate worker assignments and remaining availability.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Source-owned D001 road and worker options plus RoadOps planning configuration.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PlanningOptions" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/PrimaryRoadUnavailable" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /planning/preview:
    post:
      tags: [Planning]
      summary: Build a deterministic plan preview
      operationId: previewPlan
      description: >-
        Builds a deterministic preview for only the selected candidates. Every unscheduled
        candidate returns explicit blocker codes and remediation; the request never silently
        drops a candidate.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [candidateIds, dateFrom, dateTo]
              properties:
                candidateIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { $ref: "#/components/schemas/PlanningCandidateId" }
                dateFrom: { type: string, format: date }
                dateTo: { type: string, format: date }
      responses:
        "201":
          description: Persisted preview snapshot with explicit feasibility and actor action flags.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PlanPreview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/PrimaryRoadUnavailable" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "419": { $ref: "#/components/responses/CsrfMismatch" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /planning/manual/preview:
    post:
      tags: [Planning]
      summary: Build a manual plan preview
      operationId: previewManualPlan
      description: >-
        Builds and persists a preview for D001 from an operator-selected work variant, chainage,
        traffic-safety scheme and workers. The response always exposes red/green resource checks,
        each worker's 420-minute balance and any blocking remediation.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualPlanInput" }
      responses:
        "201":
          description: Persisted manual preview awaiting an independent approval decision.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PlanPreview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/PrimaryRoadUnavailable" }
        "409": { $ref: "#/components/responses/Conflict" }
        "419": { $ref: "#/components/responses/CsrfMismatch" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /planning/plans:
    get:
      tags: [Planning]
      summary: List planning runs
      operationId: listPlans
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Planning run snapshots.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, page, pageSize, total]
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/PlanningRunSummary" }
                          page: { type: integer, minimum: 1 }
                          pageSize: { type: integer, minimum: 1, maximum: 100 }
                          total: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/PrimaryRoadUnavailable" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /planning/plans/{id}:
    get:
      tags: [Planning]
      summary: Retrieve a persisted planning preview for handoff
      operationId: getPlan
      description: >-
        Returns the complete persisted jobs, blockers, resource checks and action permissions for
        a planning run in the caller's road-unit scope. This lets an independent approver review
        the exact server snapshot before approving and publishing it.
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Persisted planning preview with actor-specific workflow permissions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PlanPreview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/PrimaryRoadUnavailable" }
        "404": { $ref: "#/components/responses/NotFound" }

  /planning/plans/{id}/approve:
    post:
      tags: [Planning]
      summary: Independently approve a plan preview
      operationId: approvePlan
      description: >-
        Revalidates the stored snapshot and records approval by an authorized user other than the
        preview creator. A creator self-approval attempt returns 409 and leaves the plan awaiting
        approval.
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Plan approved and ready for publication.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanApproveEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/PrimaryRoadUnavailable" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            State or snapshot conflict, including the preview creator attempting to approve their
            own preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "419": { $ref: "#/components/responses/CsrfMismatch" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /planning/plans/{id}/publish:
    post:
      tags: [Planning]
      summary: Publish an approved plan
      operationId: publishPlan
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Independently approved plan and its work orders published atomically.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanPublishEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/PrimaryRoadUnavailable" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "419": { $ref: "#/components/responses/CsrfMismatch" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /work-orders:
    get:
      tags: [Work orders]
      summary: List work orders
      operationId: listWorkOrders
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [DRAFT, ASSIGNED, IN_PROGRESS, PAUSED, COMPLETED, CANCELLED]
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Work orders in the caller's road-unit scope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PagedWorkOrders" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/PrimaryRoadUnavailable" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /annual-programs:
    get:
      tags: [Annual program]
      summary: List annual program quantities
      operationId: listAnnualPrograms
      parameters:
        - name: year
          in: query
          required: false
          description: Defaults to the current application year when omitted.
          schema: { type: integer, minimum: 2000, maximum: 2200 }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: IQN resource quantities and execution; no monetary price formation.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PagedAnnualProgramLines" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/PrimaryRoadUnavailable" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /annual-programs/{id}/export.xlsx:
    get:
      tags: [Annual program]
      summary: Export an annual program workbook
      operationId: exportAnnualProgram
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: True XLSX resource-quantity export.
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/PrimaryRoadUnavailable" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reports/roadvision-findings.xlsx:
    get:
      tags: [Findings]
      summary: Export scoped RoadVision findings as Excel
      operationId: exportRoadVisionFindingsReport
      responses:
        "200":
          description: True XLSX RoadVision finding register in the caller's road-unit scope.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/PrimaryRoadUnavailable" }

  /reports/manual-inspections.xlsx:
    get:
      tags: [Findings]
      summary: Export scoped manual inspections as Excel
      operationId: exportManualInspectionsReport
      responses:
        "200":
          description: True XLSX manual-inspection and observation register.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/PrimaryRoadUnavailable" }

  /reports/confirmed-defects.xlsx:
    get:
      tags: [Findings]
      summary: Export confirmed defects as Excel
      operationId: exportConfirmedDefectsReport
      responses:
        "200":
