name: Bootstrap verified RoadOps source

on:
  push:
    paths:
      - "RoadOps-final-D001-0d6aa6f.tar.gz"

permissions:
  contents: write

concurrency:
  group: bootstrap-roadops-source
  cancel-in-progress: false

jobs:
  publish-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source archive
        shell: bash
        run: |
          echo "6f18215671ca39c00200ccefee8b48ee45f6b8053c081c8ddc8cb31a5fc505c7  RoadOps-final-D001-0d6aa6f.tar.gz" | sha256sum --check --strict

      - name: Extract source tree
        shell: bash
        run: |
          tar -xzf RoadOps-final-D001-0d6aa6f.tar.gz --strip-components=1
          rm -f RoadOps-final-D001-0d6aa6f.tar.gz
          rm -f .github/workflows/bootstrap-source.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Publish verified source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Publish production RoadOps system (source 0d6aa6f)"
          git push origin HEAD:main
